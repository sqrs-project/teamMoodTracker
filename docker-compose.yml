services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: sqlite:////data/team_mood_tracker.db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_URL: http://api:8000
      STREAMLIT_SERVER_PORT: 8501
    ports:
      - "8000:8000"
    volumes:
      - mood-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      DATABASE_URL: sqlite:////data/team_mood_tracker.db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_URL: http://api:8000
      STREAMLIT_SERVER_PORT: 8501
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mood-data:
