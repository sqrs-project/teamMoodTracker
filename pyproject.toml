[tool.poetry]
name = "team-mood-tracker"
version = "0.1.0"
description = "A lightweight FastAPI and Streamlit application for tracking team mood."
authors = ["Vlad Kuznetsov <vlad@example.com>"]
readme = "README.md"
packages = [{ include = "team_mood_tracker", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.135.3"
httpx = "^0.28.1"
pandas = "^2.2.3"
pydantic = "^2.11.3"
starlette = "^0.49.1"
streamlit = "^1.44.1"
uvicorn = { extras = ["standard"], version = "^0.34.0" }

[tool.poetry.group.dev.dependencies]
bandit = "^1.8.3"
black = "^26.3.1"
locust = "^2.37.10"
mypy = "^1.15.0"
pandas-stubs = "^2.3.0.250703"
pip-audit = "^2.9.0"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
radon = "^6.0.1"
ruff = "^0.11.5"

[tool.poetry.scripts]
interrogate = "team_mood_tracker.tools.docstrings:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
packages = ["team_mood_tracker"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/team_mood_tracker"]

[tool.coverage.report]
show_missing = true

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = false
ignore-private = true
ignore-property-decorators = false

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
