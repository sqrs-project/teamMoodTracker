name: Release Gate

on:
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry install

      - name: Check required endpoints
        run: |
          python - <<EOF
          from src import main  # FastAPI app
          required = ["/submit_mood", "/get_moods", "/stats", "/barplot", "/aggregate", "/filter"]
          existing = [r.path for r in main.app.routes]
          missing = [ep for ep in required if ep not in existing]
          if missing:
              print(f"Missing endpoints: {missing}")
              exit(1)
          EOF
