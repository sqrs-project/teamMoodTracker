name: Release Gate

on:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Validate release endpoints
        run: |
          poetry run python - <<'PY'
          from team_mood_tracker.backend.main import app

          required_paths = {
              "/entries",
              "/entries/{entry_id}",
              "/analytics/trends",
              "/analytics/distribution",
              "/analytics/summary",
              "/health",
          }
          existing_paths = {route.path for route in app.routes}
          missing = required_paths - existing_paths
          if missing:
              raise SystemExit(f"Missing paths: {sorted(missing)}")
          PY

      - name: Run tests
        run: poetry run pytest
