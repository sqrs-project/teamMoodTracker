name: CI 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Code formatting check
        run: poetry run black --check src tests

      - name: Style conformance
        run: poetry run ruff check src tests

      - name: Type checking
        run: poetry run mypy src

      - name: Cyclomatic complexity
        run: poetry run radon cc -a -s src

      - name: Maintainability index
        run: poetry run radon mi -s src

      - name: Unit tests and coverage
        run: poetry run pytest

      - name: Security code analysis
        run: poetry run bandit -r src

      - name: Security dependencies
        run: poetry run pip-audit

      - name: Documentation coverage
        run: poetry run interrogate -vv src

      - name: Start API
        run: |
          poetry run uvicorn team_mood_tracker.backend.main:app --host 127.0.0.1 --port 8000 &
          echo $! > uvicorn.pid

      - name: Wait for API
        run: |
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2):
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("API did not start in time.")
          PY

      - name: Verify OpenAPI schema
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/openapi.json", timeout=5) as response:
              schema = json.load(response)

          paths = schema["paths"]
          required_paths = [
              "/entries",
              "/entries/{entry_id}",
              "/analytics/trends",
              "/analytics/distribution",
              "/analytics/summary",
              "/health",
          ]
          for path in required_paths:
              assert path in paths, f"Missing path: {path}"

          for methods in paths.values():
              for operation in methods.values():
                  assert operation.get("summary"), "Missing operation summary"
                  assert operation.get("description"), "Missing operation description"
                  has_example = False
                  for response in operation.get("responses", {}).values():
                      content = response.get("content", {})
                      for media_type in content.values():
                          if media_type.get("example") or media_type.get("examples"):
                              has_example = True
                  assert has_example, "Missing response example"
          PY

      - name: Stop API
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)"
          fi
