services:
  api:
    container_name: team-mood-api
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/team_mood_tracker.db}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_URL: ${API_BASE_URL:-http://team-mood-api:8000}
      STREAMLIT_SERVER_PORT: 8501
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - mood-data:/data
    networks:
      - edge

  ui:
    container_name: team-mood-ui
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/team_mood_tracker.db}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_URL: ${API_BASE_URL:-http://team-mood-api:8000}
      STREAMLIT_SERVER_PORT: 8501
    expose:
      - "8501"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - edge

volumes:
  mood-data:

networks:
  edge:
    external: true
    name: backend_default

